<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Stock Dividend Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Your Dividend Dashboard</h1>
        <nav>
            <ul>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="add-stock">
            <h2>Add a New Stock</h2>
            <form id="add-stock-form">
                <label for="stock-symbol">Stock Symbol:</label>
                <input type="text" id="stock-symbol" name="stock-symbol" required>
                <label for="stock-quantity">Quantity:</label>
                <input type="number" id="stock-quantity" name="stock-quantity" required>
                <button type="submit">Add Stock</button>
            </form>
        </section>
        <section id="stock-list">
            <h2>Your Stocks</h2>
            <table>
                <thead>
                    <tr>
                        <th>Stock Symbol</th>
                        <th>Quantity</th>
                        <th>Next Dividend Date</th>
                        <th>Estimated Dividend</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Stock data will be populated here -->
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Stock Dividend Tracker</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
